[project]
name = "cartegories"
version = "2.0.0"
description = "A mobile category game for the car."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
