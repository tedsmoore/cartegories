appId: com.anonymous.cartegories-mobile
---
- runFlow: ../helpers/launch.yaml

# Home → CardSelection → DecksScreen via real navigation (not deeplinks).
- tapOn: "Quick Play"
- waitForAnimationToEnd
- tapOn:
    id: "decks-gear"
- waitForAnimationToEnd

- assertVisible:
    id: "your-decks-header"
- takeScreenshot: decks-loaded

# Toggle a free deck active (General — visible in first row)
- tapOn:
    id: "deck-cell-general"
- takeScreenshot: decks-general-active

# Toggle it off
- tapOn:
    id: "deck-cell-general"
- takeScreenshot: decks-general-inactive

# Scroll to "Get More Decks" section header
- scrollUntilVisible:
    element:
      id: "get-more-decks-header"
    direction: DOWN
- takeScreenshot: decks-get-more-visible

# Scroll until the Harry Potter locked deck is visible, then tap it
- scrollUntilVisible:
    element:
      id: "deck-cell-harry-potter"
    direction: DOWN
- tapOn:
    id: "deck-cell-harry-potter"
- assertVisible: "Coming soon"
- takeScreenshot: decks-coming-soon-alert

# Dismiss the alert
- tapOn: "OK"
- waitForAnimationToEnd

# Back to CardSelection
- tapOn:
    id: "screen-header-back"
- waitForAnimationToEnd
- assertVisible: "New Card"
